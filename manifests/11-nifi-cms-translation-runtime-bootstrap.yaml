apiVersion: v1
kind: ConfigMap
metadata:
  name: cms-translation-nifi-runtime-bootstrap
  namespace: dataflow
  annotations:
    argocd.argoproj.io/sync-wave: "64"
data:
  bootstrap_flow.py: |
    import json
    import os
    import re
    import ssl
    import time
    import urllib.error
    import urllib.request
    import uuid

    NIFI_API = os.environ.get("NIFI_API", "https://nifi-0.nifi-hs.kafka.svc.cluster.local:8443/nifi-api").rstrip("/")
    FLOW_NAME = os.environ.get("NIFI_FLOW_NAME", "cms-content-translation")
    CERT_DIR = os.environ.get("NIFI_TLS_DIR", "/nifi-tls")
    KAFKA_CREDENTIALS_DIR = os.environ.get("KAFKA_CREDENTIALS_DIR", "/kafka-credentials")
    CACHE_REFRESH_CREDENTIALS_DIR = os.environ.get("CACHE_REFRESH_CREDENTIALS_DIR", "/cache-refresh-credentials")
    CLIENT_ID = str(uuid.uuid4())

    CONTEXT = ssl.create_default_context(cafile=os.path.join(CERT_DIR, "ca.crt"))
    CONTEXT.load_cert_chain(
      certfile=os.path.join(CERT_DIR, "tls.crt"),
      keyfile=os.path.join(CERT_DIR, "tls.key"),
    )

    def api(method, path, payload=None, timeout=60):
      data = None
      headers = {"Accept": "application/json"}
      if payload is not None:
        data = json.dumps(payload).encode("utf-8")
        headers["Content-Type"] = "application/json"
      request = urllib.request.Request(f"{NIFI_API}{path}", data=data, headers=headers, method=method)
      try:
        with urllib.request.urlopen(request, context=CONTEXT, timeout=timeout) as response:
          body = response.read().decode("utf-8")
          return json.loads(body) if body else {}
      except urllib.error.HTTPError as exc:
        body = exc.read().decode("utf-8", errors="replace")
        raise RuntimeError(f"{method} {path} failed with HTTP {exc.code}: {body}") from exc

    def revision(entity):
      return {
        "clientId": CLIENT_ID,
        "version": entity["revision"]["version"],
      }

    def read_secret_file(directory, name):
      with open(os.path.join(directory, name), "r", encoding="utf-8") as secret_file:
        return secret_file.read().strip()

    def read_kafka_secret(name):
      return read_secret_file(KAFKA_CREDENTIALS_DIR, name)

    def read_cache_refresh_secret(name):
      return read_secret_file(CACHE_REFRESH_CREDENTIALS_DIR, name)

    def norm(value):
      return re.sub(r"[^a-z0-9]+", "", str(value or "").lower())

    def descriptor_key(descriptors, candidates):
      wanted = {norm(candidate) for candidate in candidates}
      for key, descriptor in descriptors.items():
        names = [key, descriptor.get("name"), descriptor.get("displayName")]
        if any(norm(name) in wanted for name in names):
          return key
      available = ", ".join(sorted(descriptors.keys()))
      raise RuntimeError(f"Could not find descriptor {candidates}; available: {available}")

    def wait_for_cluster():
      last_error = None
      for _ in range(120):
        try:
          cluster = api("GET", "/controller/cluster", timeout=20).get("cluster", {})
          nodes = cluster.get("nodes", [])
          if nodes and all(node.get("status") == "CONNECTED" for node in nodes):
            return
        except Exception as exc:
          last_error = exc
        time.sleep(5)
      raise RuntimeError(f"NiFi cluster was not ready: {last_error}")

    def find_process_group():
      for _ in range(180):
        root = api("GET", "/flow/process-groups/root", timeout=30).get("processGroupFlow", {})
        for process_group in root.get("flow", {}).get("processGroups", []):
          component = process_group.get("component", {})
          if component.get("name") == FLOW_NAME:
            return component["id"]
        time.sleep(5)
      raise RuntimeError(f"Process group {FLOW_NAME} was not found under root.")

    def list_processors(process_group_id):
      return api("GET", f"/process-groups/{process_group_id}/processors").get("processors", [])

    def list_connections(process_group_id):
      return api("GET", f"/process-groups/{process_group_id}/connections").get("connections", [])

    def list_controller_services(process_group_id):
      return api("GET", f"/flow/process-groups/{process_group_id}/controller-services").get("controllerServices", [])

    def find_by_name(entities, name):
      for entity in entities:
        if entity.get("component", {}).get("name") == name:
          return entity
      return None

    def ensure_controller_service(process_group_id):
      existing = find_by_name(list_controller_services(process_group_id), "cms-translation-kafka-connection")
      if existing:
        return existing
      return api(
        "POST",
        f"/process-groups/{process_group_id}/controller-services",
        {
          "revision": {"clientId": CLIENT_ID, "version": 0},
          "component": {
            "name": "cms-translation-kafka-connection",
            "type": "org.apache.nifi.kafka.service.Kafka3ConnectionService",
            "bundle": {
              "group": "org.apache.nifi",
              "artifact": "nifi-kafka-3-service-nar",
              "version": "2.7.1",
            },
          },
        },
      )

    def ensure_processor(process_group_id, name, processor_type, artifact, x, y):
      existing = find_by_name(list_processors(process_group_id), name)
      if existing:
        return existing
      return api(
        "POST",
        f"/process-groups/{process_group_id}/processors",
        {
          "revision": {"clientId": CLIENT_ID, "version": 0},
          "component": {
            "name": name,
            "type": processor_type,
            "bundle": {
              "group": "org.apache.nifi",
              "artifact": artifact,
              "version": "2.7.1",
            },
            "position": {"x": x, "y": y},
          },
        },
      )

    def configure_controller_service(entity, property_specs):
      entity = api("GET", f"/controller-services/{entity['id']}")
      component = entity["component"]
      descriptors = component.get("descriptors", {})
      properties = dict(component.get("properties") or {})
      for candidates, value in property_specs:
        properties[descriptor_key(descriptors, candidates)] = value
      return api(
        "PUT",
        f"/controller-services/{entity['id']}",
        {
          "revision": revision(entity),
          "component": {
            "id": entity["id"],
            "properties": properties,
          },
        },
      )

    def configure_processor(entity, property_specs, auto_terminated=None, dynamic_property_specs=None):
      entity = api("GET", f"/processors/{entity['id']}")
      config = entity["component"].get("config", {})
      descriptors = config.get("descriptors", {})
      properties = dict(config.get("properties") or {})
      for candidates, value in property_specs:
        properties[descriptor_key(descriptors, candidates)] = value
      for name, value in dynamic_property_specs or []:
        properties[name] = value
      new_config = {"properties": properties}
      if auto_terminated is not None:
        new_config["autoTerminatedRelationships"] = auto_terminated
      return api(
        "PUT",
        f"/processors/{entity['id']}",
        {
          "revision": revision(entity),
          "component": {
            "id": entity["id"],
            "config": new_config,
          },
        },
      )

    def set_processor_state(entity, state):
      entity = api("GET", f"/processors/{entity['id']}")
      if entity["component"].get("state") == state:
        return entity
      api(
        "PUT",
        f"/processors/{entity['id']}/run-status",
        {
          "revision": revision(entity),
          "state": state,
          "disconnectedNodeAcknowledged": False,
        },
      )
      for _ in range(60):
        current = api("GET", f"/processors/{entity['id']}")
        if current["component"].get("state") == state:
          return current
        time.sleep(1)
      raise RuntimeError(f"Processor {entity['component']['name']} did not reach {state}.")

    def set_controller_service_state(entity, state):
      entity = api("GET", f"/controller-services/{entity['id']}")
      if entity["component"].get("state") == state:
        return entity
      api(
        "PUT",
        f"/controller-services/{entity['id']}/run-status",
        {
          "revision": revision(entity),
          "state": state,
          "disconnectedNodeAcknowledged": False,
        },
      )
      for _ in range(60):
        current = api("GET", f"/controller-services/{entity['id']}")
        if current["component"].get("state") == state:
          return current
        time.sleep(1)
      raise RuntimeError(f"Controller service {entity['component']['name']} did not reach {state}.")

    def delete_connection_by_name(process_group_id, name):
      for connection in list_connections(process_group_id):
        component = connection.get("component", {})
        if component.get("name") == name:
          api(
            "DELETE",
            f"/connections/{connection['id']}?version={connection['revision']['version']}&clientId={CLIENT_ID}",
          )
          return True
      return False

    def ensure_connection(process_group_id, name, source_id, destination_id, relationships):
      for connection in list_connections(process_group_id):
        component = connection.get("component", {})
        if component.get("name") == name:
          current_source = component.get("source", {})
          current_destination = component.get("destination", {})
          current_relationships = sorted(component.get("selectedRelationships") or [])
          if (
            current_source.get("id") != source_id
            or current_destination.get("id") != destination_id
            or current_relationships != sorted(relationships)
          ):
            api(
              "DELETE",
              f"/connections/{connection['id']}?version={connection['revision']['version']}&clientId={CLIENT_ID}",
            )
            break
          return connection
      else:
        connection = None
      if connection and connection.get("component", {}).get("name") == name:
          return connection
      return api(
        "POST",
        f"/process-groups/{process_group_id}/connections",
        {
          "revision": {"clientId": CLIENT_ID, "version": 0},
          "component": {
            "name": name,
            "source": {
              "id": source_id,
              "groupId": process_group_id,
              "type": "PROCESSOR",
            },
            "destination": {
              "id": destination_id,
              "groupId": process_group_id,
              "type": "PROCESSOR",
            },
            "selectedRelationships": relationships,
            "flowFileExpiration": "0 sec",
            "backPressureObjectThreshold": 10000,
            "backPressureDataSizeThreshold": "1 GB",
          },
        },
      )

    def main():
      wait_for_cluster()
      process_group_id = find_process_group()

      kafka_service = ensure_controller_service(process_group_id)
      consume = ensure_processor(
        process_group_id,
        "consume-translation-requests",
        "org.apache.nifi.kafka.processors.ConsumeKafka",
        "nifi-kafka-nar",
        0,
        0,
      )
      extract_metadata = ensure_processor(
        process_group_id,
        "extract-translation-request-metadata",
        "org.apache.nifi.processors.standard.EvaluateJsonPath",
        "nifi-standard-nar",
        300,
        0,
      )
      translate = ensure_processor(
        process_group_id,
        "invoke-openwebui-wrapper",
        "org.apache.nifi.processors.standard.InvokeHTTP",
        "nifi-standard-nar",
        600,
        0,
      )
      upsert = ensure_processor(
        process_group_id,
        "upsert-directus-translation",
        "org.apache.nifi.processors.standard.InvokeHTTP",
        "nifi-standard-nar",
        900,
        0,
      )
      build_token_request = ensure_processor(
        process_group_id,
        "build-cache-refresh-token-request",
        "org.apache.nifi.processors.standard.ReplaceText",
        "nifi-standard-nar",
        1200,
        0,
      )
      request_token = ensure_processor(
        process_group_id,
        "request-cache-refresh-token",
        "org.apache.nifi.processors.standard.InvokeHTTP",
        "nifi-standard-nar",
        1500,
        0,
      )
      extract_token = ensure_processor(
        process_group_id,
        "extract-cache-refresh-token",
        "org.apache.nifi.processors.standard.EvaluateJsonPath",
        "nifi-standard-nar",
        1800,
        0,
      )
      set_refresh_auth = ensure_processor(
        process_group_id,
        "set-cache-refresh-authorization",
        "org.apache.nifi.processors.attributes.UpdateAttribute",
        "nifi-update-attribute-nar",
        2100,
        0,
      )
      build_refresh_request = ensure_processor(
        process_group_id,
        "build-cache-refresh-request",
        "org.apache.nifi.processors.standard.ReplaceText",
        "nifi-standard-nar",
        2400,
        0,
      )
      route_refresh_target = ensure_processor(
        process_group_id,
        "route-cache-refresh-target",
        "org.apache.nifi.processors.standard.RouteOnAttribute",
        "nifi-standard-nar",
        2700,
        0,
      )
      refresh_prod = ensure_processor(
        process_group_id,
        "refresh-shell-cache-prod",
        "org.apache.nifi.processors.standard.InvokeHTTP",
        "nifi-standard-nar",
        3000,
        -140,
      )
      refresh_preview = ensure_processor(
        process_group_id,
        "refresh-shell-cache-preview",
        "org.apache.nifi.processors.standard.InvokeHTTP",
        "nifi-standard-nar",
        3000,
        140,
      )
      dlq = ensure_processor(
        process_group_id,
        "publish-translation-dlq",
        "org.apache.nifi.kafka.processors.PublishKafka",
        "nifi-kafka-nar",
        1500,
        360,
      )

      processors = (
        consume,
        extract_metadata,
        translate,
        upsert,
        build_token_request,
        request_token,
        extract_token,
        set_refresh_auth,
        build_refresh_request,
        route_refresh_target,
        refresh_prod,
        refresh_preview,
        dlq,
      )

      for processor in processors:
        set_processor_state(processor, "STOPPED")
      set_controller_service_state(kafka_service, "DISABLED")

      delete_connection_by_name(process_group_id, "consume-to-translate")

      kafka_service = configure_controller_service(
        kafka_service,
        [
          (["bootstrap.servers", "Bootstrap Servers"], "#{cms.kafka.bootstrap.servers}"),
          (["security.protocol", "Security Protocol"], "#{cms.kafka.security.protocol}"),
          (["sasl.mechanism", "SASL Mechanism"], "#{cms.kafka.sasl.mechanism}"),
          (["sasl.username", "SASL Username"], read_kafka_secret("nifi_username")),
          (["sasl.password", "SASL Password"], "#{nifi_password}"),
        ],
      )
      kafka_service = set_controller_service_state(kafka_service, "ENABLED")

      consume = configure_processor(
        consume,
        [
          (["Kafka Connection Service"], kafka_service["id"]),
          (["Group ID"], "#{cms.translation.consumer.group}"),
          (["Topics"], "#{cms.translation.request.topic}"),
          (["auto.offset.reset", "Auto Offset Reset"], "earliest"),
        ],
      )
      extract_metadata = configure_processor(
        extract_metadata,
        [
          (["Destination"], "flowfile-attribute"),
          (["Return Type"], "auto-detect"),
          (["Path Not Found Behavior"], "ignore"),
          (["Null Value Representation"], "empty string"),
        ],
        None,
        [
          ("cms.page_slug", "$.page_slug"),
          ("cms.requested_language_code", "$.requested_language_code"),
          ("cms.release_channel", "$.release_channel"),
          ("cms.site_key", "$.site_key"),
        ],
      )
      translate = configure_processor(
        translate,
        [
          (["HTTP Method"], "POST"),
          (["HTTP URL", "Remote URL"], "#{cms.translation.service.url}"),
          (["Request Body Enabled", "Send Message Body"], "true"),
          (["Request Content-Type", "Content-Type"], "application/json"),
          (["Response Generation Required", "Always Output Response"], "true"),
          (["Socket Read Timeout"], "180 sec"),
        ],
        ["Original"],
      )
      upsert = configure_processor(
        upsert,
        [
          (["HTTP Method"], "POST"),
          (["HTTP URL", "Remote URL"], "#{cms.translation.upsert.url}"),
          (["Request Body Enabled", "Send Message Body"], "true"),
          (["Request Content-Type", "Content-Type"], "application/json"),
          (["Response Generation Required", "Always Output Response"], "true"),
          (["Socket Read Timeout"], "60 sec"),
        ],
        ["Original"],
      )
      build_token_request = configure_processor(
        build_token_request,
        [
          (["Replacement Strategy"], "Always Replace"),
          (["Replacement Value"], "grant_type=client_credentials"),
          (["Evaluation Mode"], "Entire text"),
        ],
      )
      request_token = configure_processor(
        request_token,
        [
          (["HTTP Method"], "POST"),
          (["HTTP URL", "Remote URL"], "#{cms.shell.cache.refresh.token.url}"),
          (["Request Body Enabled", "Send Message Body"], "true"),
          (["Request Content-Type", "Content-Type"], "application/x-www-form-urlencoded"),
          (["Request Username"], read_cache_refresh_secret("client_id")),
          (["Request Password"], "#{client_secret}"),
          (["Response Generation Required", "Always Output Response"], "true"),
          (["Socket Read Timeout"], "20 sec"),
        ],
        ["Original"],
      )
      extract_token = configure_processor(
        extract_token,
        [
          (["Destination"], "flowfile-attribute"),
          (["Return Type"], "scalar"),
          (["Path Not Found Behavior"], "skip"),
          (["Null Value Representation"], "empty string"),
        ],
        None,
        [("cms.cache_refresh.access_token", "$.access_token")],
      )
      set_refresh_auth = configure_processor(
        set_refresh_auth,
        [],
        None,
        [("Authorization", "Bearer ${cms.cache_refresh.access_token}")],
      )
      build_refresh_request = configure_processor(
        build_refresh_request,
        [
          (["Replacement Strategy"], "Always Replace"),
          (
            ["Replacement Value"],
            "{\"page_slug\":\"${cms.page_slug:escapeJson()}\",\"language_code\":\"${cms.requested_language_code:escapeJson()}\",\"mode\":\"purge-and-refresh\"}",
          ),
          (["Evaluation Mode"], "Entire text"),
        ],
      )
      route_refresh_target = configure_processor(
        route_refresh_target,
        [
          (["Routing Strategy"], "Route to Property name"),
        ],
        None,
        [("prod", "${cms.release_channel:equals('prod')}")],
      )
      refresh_prod = configure_processor(
        refresh_prod,
        [
          (["HTTP Method"], "POST"),
          (["HTTP URL", "Remote URL"], "#{cms.shell.cache.refresh.external.prod.url}"),
          (["Request Body Enabled", "Send Message Body"], "true"),
          (["Request Content-Type", "Content-Type"], "application/json"),
          (["Request Header Attributes Pattern"], "Authorization"),
          (["Response Generation Required", "Always Output Response"], "true"),
          (["Socket Read Timeout"], "120 sec"),
        ],
        ["Original", "Response"],
      )
      refresh_preview = configure_processor(
        refresh_preview,
        [
          (["HTTP Method"], "POST"),
          (["HTTP URL", "Remote URL"], "#{cms.shell.cache.refresh.external.preview.url}"),
          (["Request Body Enabled", "Send Message Body"], "true"),
          (["Request Content-Type", "Content-Type"], "application/json"),
          (["Request Header Attributes Pattern"], "Authorization"),
          (["Response Generation Required", "Always Output Response"], "true"),
          (["Socket Read Timeout"], "120 sec"),
        ],
        ["Original", "Response"],
      )
      dlq = configure_processor(
        dlq,
        [
          (["Kafka Connection Service"], kafka_service["id"]),
          (["Topic Name", "Topic"], "#{cms.translation.dlq.topic}"),
        ],
        ["success", "failure"],
      )

      ensure_connection(process_group_id, "consume-to-extract-metadata", consume["id"], extract_metadata["id"], ["success"])
      ensure_connection(process_group_id, "metadata-to-translate", extract_metadata["id"], translate["id"], ["matched"])
      ensure_connection(process_group_id, "metadata-failures-to-dlq", extract_metadata["id"], dlq["id"], ["failure", "unmatched"])
      ensure_connection(process_group_id, "translate-response-to-upsert", translate["id"], upsert["id"], ["Response"])
      ensure_connection(process_group_id, "translate-failures-to-dlq", translate["id"], dlq["id"], ["Failure", "No Retry", "Retry"])
      ensure_connection(process_group_id, "upsert-response-to-token-request", upsert["id"], build_token_request["id"], ["Response"])
      ensure_connection(process_group_id, "upsert-failures-to-dlq", upsert["id"], dlq["id"], ["Failure", "No Retry", "Retry"])
      ensure_connection(process_group_id, "token-request-body-to-token-api", build_token_request["id"], request_token["id"], ["success"])
      ensure_connection(process_group_id, "token-request-build-failures-to-dlq", build_token_request["id"], dlq["id"], ["failure"])
      ensure_connection(process_group_id, "token-response-to-extract-token", request_token["id"], extract_token["id"], ["Response"])
      ensure_connection(process_group_id, "token-request-failures-to-dlq", request_token["id"], dlq["id"], ["Failure", "No Retry", "Retry"])
      ensure_connection(process_group_id, "token-to-authorization-attribute", extract_token["id"], set_refresh_auth["id"], ["matched"])
      ensure_connection(process_group_id, "token-extract-failures-to-dlq", extract_token["id"], dlq["id"], ["failure", "unmatched"])
      ensure_connection(process_group_id, "authorization-to-refresh-body", set_refresh_auth["id"], build_refresh_request["id"], ["success"])
      ensure_connection(process_group_id, "refresh-body-to-route", build_refresh_request["id"], route_refresh_target["id"], ["success"])
      ensure_connection(process_group_id, "refresh-body-failures-to-dlq", build_refresh_request["id"], dlq["id"], ["failure"])
      ensure_connection(process_group_id, "prod-route-to-cache-refresh", route_refresh_target["id"], refresh_prod["id"], ["prod"])
      ensure_connection(process_group_id, "preview-route-to-cache-refresh", route_refresh_target["id"], refresh_preview["id"], ["unmatched"])
      ensure_connection(process_group_id, "prod-refresh-failures-to-dlq", refresh_prod["id"], dlq["id"], ["Failure", "No Retry", "Retry"])
      ensure_connection(process_group_id, "preview-refresh-failures-to-dlq", refresh_preview["id"], dlq["id"], ["Failure", "No Retry", "Retry"])

      for processor in (
        dlq,
        refresh_preview,
        refresh_prod,
        route_refresh_target,
        build_refresh_request,
        set_refresh_auth,
        extract_token,
        request_token,
        build_token_request,
        upsert,
        translate,
        extract_metadata,
        consume,
      ):
        set_processor_state(processor, "RUNNING")
      print(f"CMS translation NiFi flow is configured and running in process group {process_group_id}.")

    if __name__ == "__main__":
      main()
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cms-translation-nifi-runtime-bootstrap
  namespace: dataflow
  annotations:
    argocd.argoproj.io/sync-wave: "67"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-options: Replace=true
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cms-translation-nifi-runtime-bootstrap
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap-runtime-flow
          image: python:3.11-slim
          imagePullPolicy: IfNotPresent
          env:
            - name: NIFI_API
              value: "https://nifi-0.nifi-hs.kafka.svc.cluster.local:8443/nifi-api"
            - name: NIFI_FLOW_NAME
              value: "cms-content-translation"
            - name: NIFI_TLS_DIR
              value: "/nifi-tls"
            - name: KAFKA_CREDENTIALS_DIR
              value: "/kafka-credentials"
            - name: CACHE_REFRESH_CREDENTIALS_DIR
              value: "/cache-refresh-credentials"
          command: ["python", "/bootstrap/bootstrap_flow.py"]
          volumeMounts:
            - name: bootstrap-script
              mountPath: /bootstrap
              readOnly: true
            - name: nifi-tls
              mountPath: /nifi-tls
              readOnly: true
            - name: kafka-credentials
              mountPath: /kafka-credentials
              readOnly: true
            - name: cache-refresh-credentials
              mountPath: /cache-refresh-credentials
              readOnly: true
      volumes:
        - name: bootstrap-script
          configMap:
            name: cms-translation-nifi-runtime-bootstrap
            defaultMode: 0555
        - name: nifi-tls
          secret:
            secretName: nifi-external-cluster-tls-auth
        - name: kafka-credentials
          secret:
            secretName: cms-translation-kafka-credentials
        - name: cache-refresh-credentials
          secret:
            secretName: cms-translation-cache-refresh-credentials
