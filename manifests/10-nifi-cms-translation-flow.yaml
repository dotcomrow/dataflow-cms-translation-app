    - name: cms.kafka.sasl.mechanism
      value: SCRAM-SHA-256
    - name: cms.translation.request.topic
      value: batch.cms.content.translation.requests.v1
    - name: cms.translation.dlq.topic
      value: batch.cms.content.translation.requests.dlq.v1
    - name: cms.translation.consumer.group
